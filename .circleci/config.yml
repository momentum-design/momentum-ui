version: 2.1

executors:
  default:
    working_directory: ~/repo
    docker:
      - image: cypress/base:24.18.0
        environment:
          TERM: xterm

jobs:
  checkout_install:
    executor: default
    steps:
      - checkout
      - run: yarn bootstrap
      - persist_to_workspace:
          root: ~/
          paths:
            - .cache
            - repo
            - .yarn

  lint:
    executor: default
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Lint all Libraries
          command: yarn lint:all

  build_tokens:
    executor: default
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Build tokens library
          command: yarn build:tokens
      - store_artifacts:
          path: ~/repo/tokens/dist/
      - persist_to_workspace:
          root: ~/
          paths:
            - repo/tokens/dist/
      - run:
          name: Clear Git changed files
          command: git checkout -- .

  build_legacy_packages:
    executor: default
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Build changed legacy packages
          command: node tools/buildChangedPackages.js
      - run:
          name: Clear Git changed files
          command: git checkout -- .

  test_icons:
    executor: default
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Test icons library
          command: yarn ci:test:icons
      - run:
          name: Clear Git changed files
          command: git checkout -- .

  test_icons_rebrand:
    executor: default
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Test icons-rebrand library
          command: yarn ci:test:icons-rebrand
      - run:
          name: Clear Git changed files
          command: git checkout -- .

  test_web_components:
    executor: default
    resource_class: large
    steps:
      - attach_workspace:
          at: ~/
      - run: yarn bootstrap
      - run:
          name: Build web components library
          command: yarn build:wc
      - run:
          name: Unit Test web components library
          command: yarn ci:test:wc
      - run:
          name: Build Storybook
          command: yarn storybook:wc-dist
      - run:
          name: Clear Git changed files
          command: git checkout -- .

  static_analysis:
    executor: default
    steps:
      - attach_workspace:
          at: ~/
      - run: yarn bootstrap
      - run:
          name: Build web components library
          command: yarn build:wc
      - run:
          name: Unit Test web components library
          command: yarn ci:test:wc
      - run:
          name: Upload Codecov report
          command: bash <(curl -s https://codecov.io/bash)
      - run:
          name: Clear Git changed files
          command: git checkout -- .

workflows:
  lint_test:
    jobs:
      - checkout_install
      - lint:
          requires:
            - checkout_install
      - build_tokens:
          requires:
            - lint
      - build_legacy_packages:
          requires:
            - build_tokens
      - test_web_components:
          requires:
            - build_tokens
      - test_icons:
          requires:
            - lint
      - test_icons_rebrand:
          requires:
            - lint
      - static_analysis:
          requires:
            - build_tokens
